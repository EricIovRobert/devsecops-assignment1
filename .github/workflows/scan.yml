name: WordPress WPScan Security Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create Docker network
        run: docker network create wp-network

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db \
            --network wp-network \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            mysql:8.0

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec wp-db mysqladmin ping -h localhost -u root -prootpassword --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i..."
            sleep 5
          done

      - name: Start WordPress container
        run: |
          docker run -d --name wp-site \
            --network wp-network \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            -p 8080:80 \
            wordpress:5.8

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "WordPress is up! HTTP status: $STATUS"
              break
            fi
            echo "Attempt $i - HTTP status: $STATUS"
            sleep 5
          done

      - name: Install WordPress with WP-CLI
        run: |
          docker run --rm \
            --network wp-network \
            --volumes-from wp-site \
            wordpress:cli \
            wp core install \
              --path=/var/www/html \
              --url=http://localhost:8080 \
              --title="Test Site" \
              --admin_user=admin \
              --admin_password=Admin1234! \
              --admin_email=admin@example.com \
              --skip-email \
              --allow-root

      - name: Run WPScan
        run: |
          docker run --rm \
            --network host \
            wpscanteam/wpscan \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --force \
            --api-token ${{ secrets.WPSCAN_API_TOKEN }} \
            2>&1 | tee scans/wpscan-actions.txt || true

      - name: Upload WPScan results as artifact
        uses: actions/upload-artifact@v5
        with:
          name: wpscan-results
          path: scans/wpscan-actions.txt
